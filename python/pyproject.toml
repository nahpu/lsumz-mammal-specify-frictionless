[project]
name = "lsumz-mammal-specify-frictionless"
version = "0.1.0"
description = "Convert NAHPU Data Packages into LSUMZ Mammalogy Specify WorkBench sheets."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = ["frictionless>=5.18"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
